        // Sound Engine
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTone(freq, type, duration, vol = 0.1) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }

            coin() {
                this.playTone(987.77, 'sine', 0.08, 0.15);
                setTimeout(() => this.playTone(1318.51, 'sine', 0.12, 0.2), 50);
            }

            collect() {
                this.playTone(523.25, 'sine', 0.1, 0.15);
                setTimeout(() => this.playTone(783.99, 'sine', 0.15, 0.15), 60);
            }

            powerup() {
                this.playTone(440, 'triangle', 0.1, 0.2);
                setTimeout(() => this.playTone(659.25, 'triangle', 0.1, 0.2), 80);
                setTimeout(() => this.playTone(880, 'triangle', 0.2, 0.2), 160);
            }

            hit() {
                this.playTone(120, 'sawtooth', 0.3, 0.3);
                setTimeout(() => this.playTone(60, 'sawtooth', 0.4, 0.3), 100);
            }

            boost() {
                this.playTone(350, 'sine', 0.08, 0.08);
            }

            buy() {
                this.playTone(587.33, 'triangle', 0.1, 0.2);
                setTimeout(() => this.playTone(880, 'sine', 0.2, 0.25), 80);
            }
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030308, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 10);
            camera.lookAt(0, 1, -10);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
            scene.add(ambientLight);

            lightPulse = new THREE.PointLight(0x00f3ff, 2.5, 35);
            lightPulse.position.set(0, 3, -2);
            scene.add(lightPulse);

            const pinkLight = new THREE.PointLight(0xff007f, 2, 45);
            pinkLight.position.set(0, 5, -30);
            scene.add(pinkLight);

            createGridFloor();

            playerGroup = new THREE.Group();
            playerGroup.position.set(0, 0.8, 0);
            scene.add(playerGroup);

            const shieldGeo = new THREE.SphereGeometry(1.5, 16, 16);
            const shieldMat = new THREE.MeshBasicMaterial({
                color: 0x00f3ff,
                wireframe: true,
                transparent: true,
                opacity: 0.6
            });
            shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
            shieldMesh.visible = false;
            playerGroup.add(shieldMesh);

            playerGroup.userData = {
                targetX: 0,
                hasShield: false,
                shieldTime: 0,
                boostActive: false
            };

            rebuildPlayerShip();
            window.addEventListener('resize', onWindowResize);
        }

        function createGridFloor() {
            const size = 200;
            const divisions = 40;
            gridFloor = new THREE.GridHelper(size, divisions, 0x00f3ff, 0xff007f);
            gridFloor.position.z = -80;
            gridFloor.position.y = 0;
            scene.add(gridFloor);
        }

        function rebuildPlayerShip() {
            if (shipMesh) playerGroup.remove(shipMesh);

            const skin = SKINS.find(s => s.id === activeSkinId) || SKINS[0];
            shipMesh = new THREE.Group();

            const primaryMat = new THREE.MeshStandardMaterial({
                color: 0x090c1a,
                emissive: skin.color,
                emissiveIntensity: 0.6,
                roughness: 0.2,
                metalness: 0.8
            });

            const wireMat = new THREE.MeshBasicMaterial({ color: skin.color, wireframe: true });

            if (skin.type === 'pyramid') {
                const geo = new THREE.ConeGeometry(0.85, 2.2, 4);
                geo.rotateX(Math.PI / 2);
                const mesh = new THREE.Mesh(geo, primaryMat);
                const wire = new THREE.Mesh(geo, wireMat);
                wire.scale.set(1.02, 1.02, 1.02);
                shipMesh.add(mesh, wire);
            } else if (skin.type === 'sleek') {
                const geo = new THREE.ConeGeometry(0.7, 2.6, 5);
                geo.rotateX(Math.PI / 2);
                const wingGeo = new THREE.BoxGeometry(2.2, 0.1, 0.8);
                const mesh = new THREE.Mesh(geo, primaryMat);
                const wings = new THREE.Mesh(wingGeo, primaryMat);
                wings.position.set(0, 0, 0.3);
                shipMesh.add(mesh, wings);
            } else if (skin.type === 'stealth') {
                const geo = new THREE.OctahedronGeometry(1.0);
                geo.scale(1, 0.3, 1.8);
                const mesh = new THREE.Mesh(geo, primaryMat);
                const wire = new THREE.Mesh(geo, wireMat);
                shipMesh.add(mesh, wire);
            } else if (skin.type === 'twin') {
                const geoLeft = new THREE.CylinderGeometry(0.2, 0.35, 2.2, 6);
                geoLeft.rotateX(Math.PI / 2);
                const leftEngine = new THREE.Mesh(geoLeft, primaryMat);
                leftEngine.position.x = -0.55;

                const rightEngine = new THREE.Mesh(geoLeft, primaryMat);
                rightEngine.position.x = 0.55;

                const centerWing = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.15, 0.8), primaryMat);
                shipMesh.add(leftEngine, rightEngine, centerWing);
            } else if (skin.type === 'crown') {
                const geo = new THREE.DodecahedronGeometry(0.9);
                geo.scale(0.9, 0.6, 1.4);
                const mesh = new THREE.Mesh(geo, primaryMat);
                const crownRing = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.08, 8, 16), wireMat);
                crownRing.rotateX(Math.PI / 2);
                shipMesh.add(mesh, crownRing);
            }

            lightPulse.color.setHex(skin.color);
            playerGroup.add(shipMesh);
        }

        function spawnObstacle() {
            const x = (Math.random() - 0.5) * (TRACK_WIDTH - 2);
            const types = ['cube', 'pyramid', 'wall'];
            const type = types[Math.floor(Math.random() * types.length)];

            let geo;
            const color = 0xff0055;

            if (type === 'cube') {
                geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            } else if (type === 'pyramid') {
                geo = new THREE.ConeGeometry(1.2, 2, 4);
            } else {
                geo = new THREE.BoxGeometry(3.5, 1.2, 0.8);
            }

            const mat = new THREE.MeshStandardMaterial({
                color: 0x110008,
                emissive: color,
                emissiveIntensity: 0.8,
                roughness: 0.2
            });

            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0.8, -100);
            scene.add(mesh);

            obstacles.push({ mesh, type, radius: 1.2 });
        }

        function spawnPowerup() {
            const x = (Math.random() - 0.5) * (TRACK_WIDTH - 2);
            const types = ['shield', 'multiplier', 'boost'];
            const type = types[Math.floor(Math.random() * types.length)];

            let color = 0x00f3ff;
            if (type === 'multiplier') color = 0xff007f;
            if (type === 'boost') color = 0xa855f7;

            const geo = new THREE.OctahedronGeometry(0.7);
            const mat = new THREE.MeshBasicMaterial({ color, wireframe: true });
            const mesh = new THREE.Mesh(geo, mat);

            mesh.position.set(x, 1, -100);
            scene.add(mesh);

            powerups.push({ mesh, type, color, radius: 1.0 });
        }

        function spawnCoin() {
            const x = (Math.random() - 0.5) * (TRACK_WIDTH - 2.5);
            const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 12);
            geo.rotateX(Math.PI / 2);

            const mat = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                emissive: 0xfacc15,
                emissiveIntensity: 0.8,
                metalness: 0.9,
                roughness: 0.1
            });

            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0.8, -100);
            scene.add(mesh);

            coinObjects.push({ mesh, radius: 0.8 });
        }

        function spawnParticleBurst(pos, colorHex) {
            for (let i = 0; i < 18; i++) {
                const geo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
                const mat = new THREE.MeshBasicMaterial({ color: colorHex });
                const p = new THREE.Mesh(geo, mat);
                p.position.copy(pos);
                p.userData = {
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    vz: (Math.random() - 0.5) * 0.4,
                    life: 25
                };
                scene.add(p);
                particles.push(p);
            }
        }

        function spawnEngineTrail() {
            const skin = SKINS.find(s => s.id === activeSkinId) || SKINS[0];
            const geo = new THREE.BoxGeometry(0.1, 0.1, 0.2);
            const mat = new THREE.MeshBasicMaterial({ color: skin.trailColor, transparent: true, opacity: 0.8 });
            const p = new THREE.Mesh(geo, mat);
            
            p.position.set(
                playerGroup.position.x + (Math.random() - 0.5) * 0.3,
                playerGroup.position.y,
                playerGroup.position.z + 1.0
            );

            scene.add(p);

                } else {

                coins -= skin.price;
                unlockedSkins.push(skinId);

                    </div>

                    <div>

                            : `<button onclick="buyUpgrade('${upg.id}')" ${!canAfford ? 'disabled' : ''} class="py-2 px-3 rounded-lg font-bold text-xs font-orbitron flex items-center gap-1 ${

        window.buyUpgrade = (upgId) => {
            const upg = UPGRADES.find(u => u.id === upgId);
            const currentLvl = upgradeLevels[upgId] || 0;
            if (upg && currentLvl < upg.maxLevel) {
                const cost = Math.floor(upg.baseCost * Math.pow(upg.costScale, currentLvl));
                if (coins >= cost) {
                    coins -= cost;
                    upgradeLevels[upgId] = currentLvl + 1;
                    updateStorageAndUI();
                    renderUpgrades();
                    SFX.buy();
                }
            }
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === ' ' || e.key === 'Shift') keys.boost = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === ' ' || e.key === 'Shift') keys.boost = false;
        });

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
        btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
        btnRight.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
        btnBoost.addEventListener('touchstart', (e) => { e.preventDefault(); keys.boost = true; });
        btnBoost.addEventListener('touchend', (e) => { e.preventDefault(); keys.boost = false; });

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) touchStartX = e.touches[0].clientX;
        });
        window.addEventListener('touchmove', (e) => {
            if (!touchStartX || !isRunning) return;
            const diffX = e.touches[0].clientX - touchStartX;
            if (Math.abs(diffX) > 10) {
                playerGroup.userData.targetX += diffX * 0.02;
                touchStartX = e.touches[0].clientX;
            }
        });

        audioToggle.addEventListener('click', () => {
            SFX.enabled = !SFX.enabled;
            audioIcon.className = SFX.enabled ? 'fa-solid fa-volume-high text-base md:text-lg' : 'fa-solid fa-volume-xmark text-base md:text-lg text-red-400';
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        function startGame() {
            SFX.init();
            score = 0;
            sessionCoins = 0;
            scoreMultiplier = 1;
            speedMultiplier = 1;
            frameCount = 0;

            obstacles.forEach(o => scene.remove(o.mesh));
            powerups.forEach(p => scene.remove(p.mesh));
            coinObjects.forEach(c => scene.remove(c.mesh));
            particles.forEach(p => scene.remove(p));
            engineTrailParticles.forEach(p => scene.remove(p));

            obstacles = [];
            powerups = [];
            coinObjects = [];
            particles = [];
            engineTrailParticles = [];

            playerGroup.position.set(0, 0.8, 0);
            playerGroup.userData.targetX = 0;
            playerGroup.userData.hasShield = false;
            playerGroup.userData.boostActive = false;
            shieldMesh.visible = false;

            mainMenu.classList.add('hidden');
            gameOverMenu.classList.add('hidden');
            shopMenu.classList.add('hidden');
            gameHeader.classList.remove('hidden');
            touchControls.classList.remove('hidden');

            isRunning = true;
        }

        function triggerGameOver() {
            isRunning = false;

            coins += sessionCoins;
            if (score > highScore) {
                highScore = Math.floor(score);
                localStorage.setItem('cyber_runner_3d_hs', highScore.toString());
            }

            updateStorageAndUI();

            finalScore.textContent = Math.floor(score).toLocaleString();
            finalCoins.textContent = `+${sessionCoins.toLocaleString()}`;
            finalHighScore.textContent = highScore.toLocaleString();

            gameHeader.classList.add('hidden');
            touchControls.classList.add('hidden');
            gameOverMenu.classList.remove('hidden');
        }

        function updateUI() {
            scoreText.textContent = Math.floor(score).toLocaleString();
            gameCoinText.textContent = sessionCoins.toLocaleString();
            multiplierText.textContent = `x${scoreMultiplier}`;

            if (playerGroup.userData.hasShield) {
                shieldText.textContent = `${Math.ceil(playerGroup.userData.shieldTime / 60)} שניות`;
                shieldIcon.className = "fa-solid fa-shield-halved text-cyan-400 text-lg md:text-xl animate-pulse";
            } else {
                shieldText.textContent = "ללא מגן";
                shieldIcon.className = "fa-solid fa-shield-halved text-slate-500 text-lg md:text-xl";
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function applyCoinMagnet() {
            const magnetLvl = upgradeLevels['coin_magnet'] || 0;
            if (magnetLvl === 0) return;

            const pullRadius = 3.0 + (magnetLvl * 1.2);
            coinObjects.forEach(coinObj => {
                const dist = playerGroup.position.distanceTo(coinObj.mesh.position);
                if (dist < pullRadius) {
                    coinObj.mesh.position.x += (playerGroup.position.x - coinObj.mesh.position.x) * 0.15;
                    coinObj.mesh.position.y += (playerGroup.position.y - coinObj.mesh.position.y) * 0.15;
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isRunning) {
                if (shipMesh) shipMesh.rotation.y += 0.01;
                renderer.render(scene, camera);
                return;
            }

            frameCount++;
            const settings = DIFF_SETTINGS[difficulty];
            speedMultiplier = 1 + (frameCount / 2200);

            if (keys.left) playerGroup.userData.targetX -= 0.3;
            if (keys.right) playerGroup.userData.targetX += 0.3;

            const boostLvl = upgradeLevels['boost_power'] || 0;
            const boostBonus = 1 + (boostLvl * 0.2);

            if (keys.boost) {
                playerGroup.userData.boostActive = true;
                score += 3 * scoreMultiplier * boostBonus;
                SFX.boost();
            } else {
                playerGroup.userData.boostActive = false;
                score += 1 * scoreMultiplier;
            }

            playerGroup.userData.targetX = Math.max(-TRACK_WIDTH / 2, Math.min(TRACK_WIDTH / 2, playerGroup.userData.targetX));
            playerGroup.position.x += (playerGroup.userData.targetX - playerGroup.position.x) * 0.2;
            playerGroup.rotation.z = -(playerGroup.userData.targetX - playerGroup.position.x) * 0.3;

            applyCoinMagnet();

            if (frameCount % 2 === 0) {
                spawnEngineTrail();
            }

            if (playerGroup.userData.hasShield) {
                playerGroup.userData.shieldTime--;
                shieldMesh.rotation.y += 0.05;
                if (playerGroup.userData.shieldTime <= 0) {
                    playerGroup.userData.hasShield = false;
                    shieldMesh.visible = false;
                }
            }

            const runSpeed = settings.speed * speedMultiplier * (playerGroup.userData.boostActive ? 2 : 1);
            gridFloor.position.z += runSpeed;
            if (gridFloor.position.z > 0) gridFloor.position.z = -5;

            if (frameCount % Math.max(10, Math.floor(settings.spawnInterval / speedMultiplier)) === 0) {
                spawnObstacle();
            }
            if (frameCount % 180 === 0) {
                spawnCoin();
            }
            if (frameCount % 240 === 0) {
                spawnPowerup();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.mesh.position.z += runSpeed;
                obs.mesh.rotation.x += 0.02;

                const dist = playerGroup.position.distanceTo(obs.mesh.position);
                if (dist < obs.radius + 0.8) {
                    if (playerGroup.userData.hasShield) {
                        spawnParticleBurst(obs.mesh.position, 0x00f3ff);
                        SFX.hit();
                        scene.remove(obs.mesh);
                        obstacles.splice(i, 1);
                        playerGroup.userData.hasShield = false;
                        shieldMesh.visible = false;
                    } else if (playerGroup.userData.boostActive) {
                        spawnParticleBurst(obs.mesh.position, 0xff007f);
                        SFX.hit();
                        scene.remove(obs.mesh);
                        obstacles.splice(i, 1);
                        score += 300;
                    } else {
                        spawnParticleBurst(playerGroup.position, 0xff0055);
                        SFX.hit();
                        triggerGameOver();
                        return;
                    }
                    continue;
                }

                if (obs.mesh.position.z > 10) {
                    scene.remove(obs.mesh);
                    obstacles.splice(i, 1);
                }
            }

            const coinMultiLvl = upgradeLevels['coin_multiplier'] || 0;
            const coinValue = 1 + coinMultiLvl;

            for (let i = coinObjects.length - 1; i >= 0; i--) {
                const coinObj = coinObjects[i];
                coinObj.mesh.position.z += runSpeed;
                coinObj.mesh.rotation.y += 0.08;

                const dist = playerGroup.position.distanceTo(coinObj.mesh.position);
                if (dist < coinObj.radius + 0.8) {
                    sessionCoins += coinValue;
                    score += 50 * coinValue;
                    SFX.coin();
                    spawnParticleBurst(coinObj.mesh.position, 0xffd700);
                    scene.remove(coinObj.mesh);
                    coinObjects.splice(i, 1);
                    continue;
                }

                if (coinObj.mesh.position.z > 10) {
                    scene.remove(coinObj.mesh);
                    coinObjects.splice(i, 1);
                }
            }

            const shieldLvl = upgradeLevels['shield_duration'] || 0;
            const bonusShieldTime = 300 + (shieldLvl * 100);

            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.mesh.position.z += runSpeed * 0.9;
                p.mesh.rotation.y += 0.05;

                const dist = playerGroup.position.distanceTo(p.mesh.position);
                if (dist < p.radius + 0.8) {
                    if (p.type === 'shield') {
                        playerGroup.userData.hasShield = true;
                        playerGroup.userData.shieldTime = bonusShieldTime;
                        shieldMesh.visible = true;
                        SFX.powerup();
                    } else if (p.type === 'multiplier') {
                        scoreMultiplier += 1;
                        SFX.collect();
                    } else if (p.type === 'boost') {
                        playerGroup.userData.boostActive = true;
                        SFX.powerup();
                    }

                    spawnParticleBurst(p.mesh.position, p.color);
                    scene.remove(p.mesh);
                    powerups.splice(i, 1);
                    continue;
                }

                if (p.mesh.position.z > 10) {
                    scene.remove(p.mesh);
                    powerups.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.position.x += pt.userData.vx;
                pt.position.y += pt.userData.vy;
                pt.position.z += pt.userData.vz;
                pt.userData.life--;
                if (pt.userData.life <= 0) {
                    scene.remove(pt);
                    particles.splice(i, 1);
                }
            }

            for (let i = engineTrailParticles.length - 1; i >= 0; i--) {
                const tp = engineTrailParticles[i];
                tp.position.z += 0.4;
                tp.userData.life--;
                tp.material.opacity = tp.userData.life / tp.userData.maxLife;
                if (tp.userData.life <= 0) {
                    scene.remove(tp);
                    engineTrailParticles.splice(i, 1);
                }
            }

            updateUI();
            renderer.render(scene, camera);
        }

        window.onload = () => {
            updateStorageAndUI();
            initThree();
            animate();
        };
    </script>
</body>
</html>
